name: mise-a-jour

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  formule:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      change: ${{ steps.reprendre.outputs.change }}
      version: ${{ steps.reprendre.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reprendre la formule
        id: reprendre
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo FantasmaGlad/Bonk --pattern bonk.rb --dir Formula --clobber
          gh release download --repo FantasmaGlad/Bonk --pattern SHA256SUMS --dir "$RUNNER_TEMP" --clobber
          version=$(sed -n 's/^  version "\(.*\)"/\1/p' Formula/bonk.rb)
          python3 scripts/formule-cli.py "$RUNNER_TEMP/SHA256SUMS" "$version" > Formula/bonk-cli.rb
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git status --porcelain | grep -q .; then echo "change=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formules
          path: Formula/
          retention-days: 1

  essai:
    needs: formule
    if: needs.formule.outputs.change == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formules
          path: formules
      # Homebrew n'installe une formule que depuis un tap : un tap local reçoit celles qui vont être publiées.
      - name: Installer les deux formules
        run: |
          brew tap-new --no-git essai/bonk
          cp formules/*.rb "$(brew --repository essai/bonk)/Formula/"
          brew install essai/bonk/bonk
          bonk --version
          brew uninstall bonk
          brew install essai/bonk/bonk-cli
          bonk --version

  publication:
    needs: [formule, essai]
    if: needs.formule.outputs.change == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Le jeton reste dans le dépôt cloné : ce job pousse, et ne fait rien d'autre.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formules
          path: Formula
      - name: Publier
        env:
          VERSION: ${{ needs.formule.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          git commit -m "feat(formule): passer en $VERSION"
          git push
